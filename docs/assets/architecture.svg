<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="ZIMREAPER architecture: agent to MCP server to control plane, then Chromium through a proxy to the in-scope target">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9bb0"/>
    </marker>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" fill="#05070b"/>
  <rect width="1000" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="2.5" fill="url(#top)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="24" y="40" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="1.4">HOW A CALL TRAVELS</text>
    <text x="24" y="62" fill="#94a3b8" font-size="13">one tool call, from the model to a real mouse event in a real tab</text>

    <!-- arrows -->
    <g stroke="#8b9bb0" stroke-width="1.8" fill="none" marker-end="url(#ar)">
      <path d="M 320 136 L 346 136"/>
      <path d="M 650 136 L 676 136"/>
      <path d="M 830 192 L 830 244"/>
      <path d="M 676 306 L 650 306"/>
      <path d="M 346 306 L 320 306"/>
    </g>
    <g fill="#8b9bb0" font-size="11.5" text-anchor="middle">
      <text x="333" y="124">SPAWN</text>
      <text x="665" y="124">RPC</text>
      <text x="855" y="222" text-anchor="start">CDP</text>
      <text x="663" y="294">MITM</text>
      <text x="333" y="294">HTTP</text>
    </g>

    <!-- row 1 -->
    <g>
      <rect x="20" y="80" width="285" height="112" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="40" y="110" fill="#e2e8f0" font-size="16" font-weight="700">AGENT</text>
      <text x="40" y="136" fill="#cbd5e1" font-size="13">Claude Code · Desktop · Hermes</text>
      <text x="40" y="158" fill="#cbd5e1" font-size="13">Codex · Cursor · Cline</text>
      <text x="40" y="180" fill="#7c8ba1" font-size="11.5">no shell, only the tools</text>
    </g>

    <g>
      <rect x="350" y="80" width="300" height="112" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
      <rect x="350" y="80" width="300" height="112" rx="10" fill="rgba(76,29,149,0.28)"/>
      <text x="370" y="110" fill="#c4b5fd" font-size="16" font-weight="700">MCP SERVER</text>
      <text x="370" y="136" fill="#cbd5e1" font-size="13">21 browser_* tools</text>
      <text x="370" y="158" fill="#cbd5e1" font-size="13">stdio transport</text>
      <text x="370" y="180" fill="#7c8ba1" font-size="11.5">ships inside the AppImage</text>
    </g>

    <g>
      <rect x="680" y="80" width="300" height="112" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="680" y="80" width="300" height="112" rx="10" fill="rgba(8,51,68,0.5)"/>
      <text x="700" y="110" fill="#a5f3fc" font-size="16" font-weight="700">CONTROL PLANE</text>
      <text x="700" y="136" fill="#cbd5e1" font-size="13">policy · executor · audit</text>
      <text x="700" y="158" fill="#cbd5e1" font-size="13">perception · replay</text>
      <text x="700" y="180" fill="#7c8ba1" font-size="11.5">ws://127.0.0.1:7420</text>
    </g>

    <!-- row 2, flowing right to left -->
    <g>
      <rect x="680" y="250" width="300" height="112" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="680" y="250" width="300" height="112" rx="10" fill="rgba(8,51,68,0.32)"/>
      <text x="700" y="280" fill="#a5f3fc" font-size="16" font-weight="700">CHROMIUM</text>
      <text x="700" y="306" fill="#cbd5e1" font-size="13">real tabs, real contexts</text>
      <text x="700" y="328" fill="#cbd5e1" font-size="13">Input.dispatch* events</text>
      <text x="700" y="350" fill="#7c8ba1" font-size="11.5">mouse · keys · wheel · drag</text>
    </g>

    <g>
      <rect x="350" y="250" width="300" height="112" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
      <rect x="350" y="250" width="300" height="112" rx="10" fill="rgba(251,146,60,0.22)"/>
      <text x="370" y="280" fill="#fdba74" font-size="16" font-weight="700">PROXY</text>
      <text x="370" y="306" fill="#cbd5e1" font-size="13">mitmproxy · Burp · ZAP</text>
      <text x="370" y="328" fill="#cbd5e1" font-size="13">HTTP and TLS via CA</text>
      <text x="370" y="350" fill="#7c8ba1" font-size="11.5">loopback included</text>
    </g>

    <g>
      <rect x="20" y="250" width="300" height="112" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="20" y="250" width="300" height="112" rx="10" fill="rgba(120,53,15,0.3)"/>
      <text x="40" y="280" fill="#fcd34d" font-size="16" font-weight="700">TARGET</text>
      <text x="40" y="306" fill="#cbd5e1" font-size="13">in-scope app and API</text>
      <text x="40" y="328" fill="#cbd5e1" font-size="13">refused if out of scope</text>
      <text x="40" y="350" fill="#7c8ba1" font-size="11.5">policy-gated</text>
    </g>

    <text x="24" y="392" fill="#5b6b80" font-size="12">recorded along the way: audit chain · replay traces · discovery files · screenshots and page text</text>
  </g>
</svg>
