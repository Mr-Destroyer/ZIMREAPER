name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/p0-smoke.mjs
      - run: node scripts/mcp-check.mjs
      - run: node scripts/capabilities-check.mjs
